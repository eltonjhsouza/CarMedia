# XcodeGen spec — build LITE: no Broadcast Upload Extension.
# Why: personal/free Apple ID signing commonly rejects embedded ReplayKit
# broadcast extensions, and the mirroring PoC is flag-off by default anyway.
# This spec is what the `install-artifact` workflow packages into an
# Sideloadly-ready unsigned IPA. The full spec (project.yml) stays canonical.
name: CarMedia
options:
  bundleIdPrefix: dev.carmedia
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  CarMedia:
    type: application
    platform: iOS
    sources:
      - path: CarMedia
        excludes:
          - "Resources/Info.plist"
          - "Mirroring/MirroringView.swift"   # no broadcast UI in lite builds
          - "Mirroring/SharedStore.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.carmedia.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CarMedia/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Entitlements/CarMedia.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: CARMEDIA_LITE
schemes:
  CarMediaLite:
    build:
      targets:
        CarMedia: all
    run:
      config: Release
