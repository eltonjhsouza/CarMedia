# CarMedia — IPA assinado (fluxo SEPARADO do build de verificação).
#
# Requisitos (GitHub Secrets, nada disto vai no repositório):
#   APPLE_CERT_P12_BASE64  certificate .p12 exportado do Keychain, base64
#   APPLE_CERT_PASSWORD    senha do .p12
#   APPLE_PROFILE_BASE64   provisioning profile .mobileprovision (dev ou
#                          ad-hoc) que cubra o bundle id do app E da extensão
#   APPLE_TEAM_ID          ex.: ABCDE12345
# Sem esses secrets, a etapa de assinatura é IGNORADA explicitamente e o job
# termina com aviso claro — sem quebrar o fluxo de verificação de código.
#
# CarPlay: o input carplay_entitlements só pode ser true depois que a Apple
# conceder com.apple.developer.carplay-audio + carplay-video ao SEU time.
name: release-ipa

on:
  workflow_dispatch:
    inputs:
      carplay_entitlements:
        description: "Sign with CarPlay entitlements (only if Apple granted them)"
        type: boolean
        default: false

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.s.outputs.have }}
    steps:
      - id: s
        env:
          P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          PROF: ${{ secrets.APPLE_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROF" ] && [ -n "$TEAM" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets ausentes — o IPA assinado NÃO será gerado. O job de código continua válido."
          fi

  archive:
    needs: check-secrets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate

      - name: Select entitlements
        run: |
          if [ "${{ inputs.carplay_entitlements }}" = "true" ]; then
            echo "ENT=Entitlements/CarPlay.entitlements" >> "$GITHUB_ENV"
            echo "::warning::Assinando com carplay-audio+carplay-video. Se a Apple não concedeu os entitlements ao time, o app não aparecerá no carro (comportamento documentado)."
          else
            echo "ENT=Entitlements/CarMedia.entitlements" >> "$GITHUB_ENV"
          fi

      - name: Unsigned device build (always, for artifacts)
        run: |
          xcodebuild build \
            -project CarMedia.xcodeproj -scheme CarMedia \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tail -20
        continue-on-error: false

      - name: Upload unsigned build (NOT installable on a phone!)
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: build/Release-iphoneos/CarMedia.app
          if-no-files-found: warn

      - if: needs.check-secrets.outputs.signing == 'true'
        name: Decode signing material
        run: |
          echo "${{ secrets.APPLE_CERT_P12_BASE64 }}" | base64 -d > cert.p12
          echo "${{ secrets.APPLE_PROFILE_BASE64 }}"  | base64 -d > profile.mobileprovision
          KEYCHAIN_PW=$(uuidgen)
          echo "KEYCHAIN_PW=$KEYCHAIN_PW" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import cert.p12 -k build.keychain -P '${{ secrets.APPLE_CERT_PASSWORD }}' -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - if: needs.check-secrets.outputs.signing == 'true'
        name: Archive
        run: |
          xcodebuild archive \
            -project CarMedia.xcodeproj -scheme CarMedia -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath CarMedia.xcarchive \
            CODE_SIGN_IDENTITY='Apple Development' \
            CODE_SIGNING_REQUIRED=YES \
            DEVELOPMENT_TEAM='${{ secrets.APPLE_TEAM_ID }}' \
            CODE_SIGN_ENTITLEMENTS="$ENT"

      - if: needs.check-secrets.outputs.signing == 'true'
        name: Export IPA
        run: |
          cat > ExportOptions.plist <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key><dict>
              <key>dev.carmedia.app</key><string>REPLACE_WITH_PROFILE_NAME</string>
              <key>dev.carmedia.app.broadcast</key><string>REPLACE_WITH_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          XML
          xcodebuild -exportArchive -archivePath CarMedia.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath ipa
        # ↑ Ajuste REPLACE_WITH_PROFILE_NAME / bundle ids aos seus. Veja
        #   docs/SIGNING.md. O "development" method exige iPhone cadastrado.

      - if: needs.check-secrets.outputs.signing == 'true'
        name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarMedia.ipa
          path: ipa/*.ipa

      - if: needs.check-secrets.outputs.signing != 'true'
        name: Skip notice (explicit)
        run: |
          echo "::notice::Assinatura IGNORADA por falta de secrets (APPLE_CERT_P12_BASE64, APPLE_PROFILE_BASE64, APPLE_TEAM_ID). Este workflow produziu apenas o build de verificação sem assinatura, que não instala em iPhone. Configure docs/SIGNING.md para gerar IPA."
